name: Docker Image CI

on:
  push:
    tags:
      - "v*"

env:
  GHCR_REPO: ghcr.io/thegamerx1/wakeonlan

jobs:
  build-docker:
    strategy:
      matrix:
        cpu: [arm64, amd64]
        include:
          - cpu: arm64
            runner: ubuntu-24.04-arm
            tag: arm64
            dockerfile: Dockerfile.arm
          - cpu: amd64
            runner: ubuntu-latest
            tag: amd64
            dockerfile: Dockerfile
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically uses GitHub token for auth

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          provenance: false
          platforms: linux/${{ matrix.cpu }}
          push: true # Automatically push after build
          tags: "${{ env.GHCR_REPO }}:${{ github.sha }}-${{ matrix.tag }}"

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}
      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifests
        run: |
          tags='${{ env.GHCR_REPO }}:${{ github.sha }} ${{ steps.meta.outputs.tags }}'
          for tag in ${tags}
          do
            docker manifest rm ${tag} || true
            docker manifest create ${tag} ${{ env.GHCR_REPO }}:${{ github.sha }}-amd64 ${{ env.GHCR_REPO }}:${{ github.sha }}-arm64
            docker manifest push ${tag}
          done
  build-agent:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            architecture: amd64
            runner: ubuntu-latest
          - os: ubuntu-latest
            architecture: arm64
            runner: ubuntu-24.04-arm
          - os: windows-latest
            architecture: amd64
            runner: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          toolchain: "stable"

      - name: Build
        run: |
          cargo build --release -p agent

      - name: Prep release
        shell: bash
        run: |
          EXE_suffix=""
          case ${{ matrix.os }} in
            *windows*) EXE_suffix=".exe" ;;
          esac;

          mkdir release
          mv target/release/agent${EXE_suffix} release/agent-${{ matrix.os }}-${{ matrix.architecture }}${EXE_suffix}
          ls release

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v2.2.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: true
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
