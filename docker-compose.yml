version: "3.7"

services:
   app:
      build: .
      restart: unless-stopped
      container_name: wakeonlan
      environment:
         - APP_KEY=secret
         - APP_PORT=2938
         # Optional MQTT connection settings from .env.
         - MQTT_HOST
         - MQTT_PORT
         - MQTT_USERNAME
         - MQTT_PASSWORD
         - MQTT_TLS
      volumes:
         - data:/app/data
      network_mode: host

volumes:
   data:
